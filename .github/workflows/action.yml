name: Daily Weather Bot

on:
  # The external trigger for cron-job.org (and your manual button)
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installing directly in YAML so we don't need a requirements.txt file
          pip install requests python-dotenv
          
      - name: Run main.py
        env:
          # Pulling securely from your GitHub Repository Secrets
          Bot_token: ${{ secrets.BOT_TOKEN }}
          channel_id: ${{ secrets.CHANNEL_ID }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python main.py
