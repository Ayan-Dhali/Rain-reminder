name: Rain Reminder Bot

on:
  workflow_dispatch: # This allows cron-job.org to trigger it

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      # 1. Downloads your repository files into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Sets up Python 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # You can change this if you need a different version

      # 3. Installs dependencies (if you have a requirements.txt file)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Executes your Python file
      - name: Run script
        run: python main.py
